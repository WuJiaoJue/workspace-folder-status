# 由 release-infra 安装（2026-10-19）。只拦错，不碰发布。
# 严格程度是实测出来的，不是猜的：
#   - 本仓库 `npx tsc -p tsconfig.json --noEmit` 干净通过
#   - `npm test` 本地 174 例 1.4s 全过，且不在仓库留下改动
#   - 干净重建后 `lib/` 与提交产物一致 —— 但**必须排除 `lib/client.js`**，见 artifact-drift。
# 依据（实测）：0.2.2 树原始差异只有 lib/client.js 一个文件；排除后为 0。
# 0.2.0 树（src 改了没重建 lib）排除后仍有 27 个文件被抓到。所以排除不是放水，是去掉唯一的噪声源。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装依赖
        # 这里**不能**加 --ignore-scripts：tsdown 的原生二进制靠安装脚本落地
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: npx tsc -p tsconfig.json --noEmit
      - name: 测试
        run: npm test

  # 只读守卫：不装依赖、不跑构建，永远不会改写工作区
  release-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: repository.url 的 owner/repo 必须等于本仓库
        # 破了它，catalog 的 probe 判 false → 市场版本号/下载量消失
        run: |
          node -e "
            const p = require('./package.json');
            const url = p.repository?.url || '';
            const want = process.env.GITHUB_REPOSITORY.toLowerCase();
            if (!url) { console.error('::error::缺 repository.url'); process.exit(1); }
            if (!url.toLowerCase().includes(want)) {
              console.error('::error::repository.url=' + url + ' 不含 ' + want);
              process.exit(1);
            }
          "
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: prepare 钩子会破坏 --ignore-scripts 发布法
        run: |
          node -e "
            const p = require('./package.json');
            if (p.scripts?.prepare) {
              console.error('::error::有 prepare 钩子，请把构建移到 prepack / prepublishOnly');
              process.exit(1);
            }
          "
      - name: 入口产物已被 git 跟踪
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.main) process.exit(0);
            const { execSync } = require('node:child_process');
            if (!execSync('git ls-files ' + p.main).toString().trim()) {
              console.error('::error::' + p.main + ' 未被跟踪（约定：产物随源码提交）');
              process.exit(1);
            }
          "
      - name: CHANGELOG 有「未发布」节可写
        # 发版时要把它改名成版本节，否则 release notes 无源
        run: |
          grep -qE '^##[ \t]+\[?(未发布|Unreleased)\]?[ \t]*$' CHANGELOG.md || {
            echo "::error::CHANGELOG 没有「未发布」小节，发版时无处写 notes"
            exit 1
          }

  artifact-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: 重新构建
        run: npm run build
      - name: lib/ 是否与提交一致（排除 lib/client.js）
        # 为什么排除 lib/client.js：tsdown 的 CSS module 类名前缀是**由构建机绝对路径哈希**
        # 出来的（实测同版本 tsdown 0.22.14，在 /tmp 重建得到 Rm17ta_，在开发机是 EgC0Ja_），
        # 所以这个文件在任何机器上重建都必然不同 —— 它不是"落后"信号，是纯噪声。
        # 顺带暴露的真问题见下面 path-leak 一步。
        run: |
          if ! git diff --quiet -- lib/ ':(exclude)lib/client.js'; then
            echo "::error title=lib/ 落后于 src::干净检出后重建，lib/ 与提交产物不一致。改 src/ 必须同 PR 重建 lib/。"
            git diff --stat -- lib/ ':(exclude)lib/client.js'
            exit 1
          fi
          echo "✔ lib/（除 client.js）与 src/ 一致"
      - name: 产物里是否泄漏构建机绝对路径
        # 已核实：已发布的 dsh-group-status@0.2.2 的 lib/client.js 里有 5 处
        # /home/<user>/workspace/... 。dsh-later@1.4.0 与 dsh-suggest-ghost@0.5.1 均为 0 处。
        # 现在是 warning：把构建改成按相对路径/内容哈希之前，这条必然红，先别挡 PR。
        run: |
          n=$(grep -roE "/home/[A-Za-z0-9_.-]+/" lib/ 2>/dev/null | wc -l)
          if [ "$n" -gt 0 ]; then
            echo "::warning title=产物含构建机绝对路径::lib/ 里有 $n 处 /home/... 路径会被发进 npm 包。修构建器后可把本步改为 blocking。"
          else
            echo "✔ 无绝对路径泄漏"
          fi
