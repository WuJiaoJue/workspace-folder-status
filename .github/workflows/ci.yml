# 只拦错，不碰发布。严格程度是实测出来的：
#   - `npx tsc -p tsconfig.json --noEmit` 干净通过
#   - `npm test` 165 例全过，且不在仓库留下改动
#   - 干净重建后 `lib/` 与提交产物逐字节一致（跨目录实测）
#
# **双平台 + 零 marketplace action**（2026-10-20 重写）：
#   Gitea 用的组织 runner 里，git 访问 github.com 是挂死的（`git ls-remote https://github.com/…`
#   无响应，虽然 node fetch 能 200）。于是 `uses: actions/checkout@v4`、`pnpm/action-setup`
#   这类 marketplace 动作会被 act 去 clone 而**永久挂起**（容器起来了、零日志、Gitea 侧一直
#   queued）。同组织的 whq/apbot 一直用纯 shell `run:`，原因就在这里。所以本文件不再用
#   任何 `uses:`，检出与 pnpm 都自己来；`runs-on` / `container` 用平台条件表达式分流：
#     GitHub → 托管 runner + node:22 容器
#     Gitea  → dsh-plugins 组织 runner（镜像自带 node 24，满足 engines.node `^22.19 || >=24`）
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'dsh-runner' }}
    container: ${{ github.server_url == 'https://github.com' && 'node:22' || '' }}
    env:
      # 版本线看守的判据来源（tests/version-line.node.test.mjs）：devDependencies 里的
      # 宿主包线必须等于它，且本包 manifest 必须通过宿主 evaluatePluginCompatibility。
      # CI 容器里没有 dsh CLI，不注入的话那条只会自洽检查、悄悄跳过。
      # 宿主换代时改这一行 + devDependencies，两者不一致会红——这是有意的。
      DSH_RUNTIME_VERSION: "0.2.1-rc.2"
    steps:
      - name: 检出源码（不用 marketplace action）
        shell: bash
        env:
          GH_SERVER: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          GH_PR: ${{ github.event.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 容器作业（GitHub 的 `container:`）里工作区属主可能与执行用户不同，
          # git 会因“dubious ownership”拒绝操作 → 实测 GitHub 侧两个 job 全红在这一步，
          # 而 Gitea（act 直跑）没有这个约束。先声明安全目录。
          git config --global --add safe.directory "$PWD" 2>/dev/null || true
          git init -q .
          git remote add origin "${GH_SERVER}/${GH_REPO}.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          fetch() { git -c "http.extraheader=Authorization: Basic $auth" fetch -q --depth=1 origin "$1"; }
          if [ -n "${GH_PR:-}" ]; then
            for r in "refs/pull/${GH_PR}/head" "refs/pull/${GH_PR}/merge"; do
              fetch "$r" 2>/dev/null && break || true
            done
          fi
          if ! git rev-parse -q --verify FETCH_HEAD >/dev/null 2>&1; then
            fetch "$GH_REF" 2>/dev/null || fetch "$GH_SHA"
          fi
          git checkout -q FETCH_HEAD
          git log -1 --format='  检出 %h %s'

      - name: 安装 pnpm（不用 marketplace action）
        # 容器里的 global 目录不可写（实测 npm i -g 报权限错），装到工作区内前缀再加 PATH
        run: |
          set -eu
          npm i -g pnpm@10 --prefix "$PWD/.toolchain" --silent
          echo "$PWD/.toolchain/bin" >> "$GITHUB_PATH"
          "$PWD/.toolchain/bin/pnpm" --version

      - name: 安装依赖
        # 这里**不能**加 --ignore-scripts：tsdown 的原生二进制靠安装脚本落地
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: npx tsc -p tsconfig.json --noEmit

      - name: 测试
        run: npm test

  # 只读守卫：不装依赖、不跑构建，永远不会改写工作区
  release-invariants:
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'dsh-runner' }}
    container: ${{ github.server_url == 'https://github.com' && 'node:22' || '' }}
    steps:
      - name: 检出源码（不用 marketplace action）
        shell: bash
        env:
          GH_SERVER: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          GH_PR: ${{ github.event.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 容器作业（GitHub 的 `container:`）里工作区属主可能与执行用户不同，
          # git 会因“dubious ownership”拒绝操作 → 实测 GitHub 侧两个 job 全红在这一步，
          # 而 Gitea（act 直跑）没有这个约束。先声明安全目录。
          git config --global --add safe.directory "$PWD" 2>/dev/null || true
          git init -q .
          git remote add origin "${GH_SERVER}/${GH_REPO}.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          fetch() { git -c "http.extraheader=Authorization: Basic $auth" fetch -q --depth=1 origin "$1"; }
          if [ -n "${GH_PR:-}" ]; then
            for r in "refs/pull/${GH_PR}/head" "refs/pull/${GH_PR}/merge"; do
              fetch "$r" 2>/dev/null && break || true
            done
          fi
          if ! git rev-parse -q --verify FETCH_HEAD >/dev/null 2>&1; then
            fetch "$GH_REF" 2>/dev/null || fetch "$GH_SHA"
          fi
          git checkout -q FETCH_HEAD

      - name: repository.url 的 owner/repo 必须等于本仓库
        # 破了它，catalog 的 probe 判 false → 市场版本号/下载量消失。
        # 注意：**不能**拿 github.repository 比 —— 本仓库在 Gitea 上是 dsh-plugins/<repo>，
        # 在 GitHub 上是 dsh-plugin-collection/<repo>，而 repository.url 必须始终指向
        # catalog 认的那个 GitHub 组织。所以比的是「预期组织 + 本仓库名」。
        run: |
          node -e "
            const name = String(process.env.GH_REPO).split('/')[1];
            const want = (process.env.EXPECTED_GH_OWNER + '/' + name).toLowerCase();
            const url = require('./package.json').repository?.url || '';
            if (!url) { console.error('::error::缺 repository.url'); process.exit(1); }
            if (!url.toLowerCase().includes(want)) {
              console.error('::error::repository.url=' + url + ' 不含 ' + want + '（catalog 会判不关联）');
              process.exit(1);
            }
            console.log('✔ repository.url 指向 ' + want);
          "
        env:
          GH_REPO: ${{ github.repository }}
          EXPECTED_GH_OWNER: dsh-plugin-collection

      - name: prepare 钩子会破坏 --ignore-scripts 发布法
        run: |
          node -e "
            const p = require('./package.json');
            if (p.scripts?.prepare) {
              console.error('::error::有 prepare 钩子，请把构建移到 prepack / prepublishOnly');
              process.exit(1);
            }
          "

      - name: 入口产物已被 git 跟踪
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.main) process.exit(0);
            const { execSync } = require('node:child_process');
            if (!execSync('git ls-files ' + p.main).toString().trim()) {
              console.error('::error::' + p.main + ' 未被跟踪（约定：产物随源码提交）');
              process.exit(1);
            }
          "

      - name: client.js 的 gzip 体积预算
        # 为什么要有这条：`lib/client.js` 随源码提交，安装方直接吃它；多一行 import 就可能让
        # 体积翻倍，而现有测试没有任何一条会因此变红。这里只量**已提交的产物**，不装依赖、
        # 不构建 —— 与本 job「只读，永不改写工作区」的约定一致。
        #
        # 上限怎么定：2026-10-27 在干净 worktree 上实测 gzip 77,312 字节 / 原始 299,199 字节
        # （行面拆分重构之后的值；重构前是 75,579 / 296,579），按 ~8.6% 余量保留 84,000。
        # 留余量是因为 gzip 的压缩率随实现与级别浮动（本地 gzip 与 runner 上的未必逐字节一致），
        # **不是**给「顺手再加点功能」留的额度：真需要变大，就在这里把 ceiling 调高，并在 PR 里
        # 说明为什么值这个体积。余量已不足一成 —— 下一次真正需要长体积的改动，请先复查预算。
        run: |
          set -eu
          if [ ! -f lib/client.js ]; then
            echo "::error title=缺 lib/client.js::体积预算量的是提交进仓库的产物，文件不在说明检出或产物约定坏了。"
            exit 1
          fi
          # 唯一要改的常量（别在别处写第二份）。
          ceiling=84000
          raw=$(wc -c < lib/client.js | tr -d '[:space:]')
          gz=$(gzip -c lib/client.js | wc -c | tr -d '[:space:]')
          pct=$(( gz * 100 / ceiling ))
          if [ "$gz" -gt "$ceiling" ]; then
            echo "::error title=client.js 超出体积预算::${gz} bytes / ceiling ${ceiling} bytes (${pct}% of budget)，原始 ${raw} bytes。要么瘦身，要么把 .github/workflows/ci.yml 里的 ceiling 调高并说明理由。"
            exit 1
          fi
          echo "✔ client.js ${gz} bytes / ceiling ${ceiling} bytes (${pct}% of budget)，原始 ${raw} bytes"

      - name: CHANGELOG 有「未发布」节可写
        # 发版时要把它改名成版本节，否则 release notes 无源
        run: |
          grep -qE '^##[ \t]+\[?(未发布|Unreleased)\]?[ \t]*$' CHANGELOG.md || {
            echo "::error::CHANGELOG 没有「未发布」小节，发版时无处写 notes"
            exit 1
          }

  artifact-drift:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'dsh-runner' }}
    container: ${{ github.server_url == 'https://github.com' && 'node:22' || '' }}
    steps:
      - name: 检出源码（不用 marketplace action）
        shell: bash
        env:
          GH_SERVER: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          GH_PR: ${{ github.event.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # 容器作业（GitHub 的 `container:`）里工作区属主可能与执行用户不同，
          # git 会因“dubious ownership”拒绝操作 → 实测 GitHub 侧两个 job 全红在这一步，
          # 而 Gitea（act 直跑）没有这个约束。先声明安全目录。
          git config --global --add safe.directory "$PWD" 2>/dev/null || true
          git init -q .
          git remote add origin "${GH_SERVER}/${GH_REPO}.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          fetch() { git -c "http.extraheader=Authorization: Basic $auth" fetch -q --depth=1 origin "$1"; }
          if [ -n "${GH_PR:-}" ]; then
            for r in "refs/pull/${GH_PR}/head" "refs/pull/${GH_PR}/merge"; do
              fetch "$r" 2>/dev/null && break || true
            done
          fi
          if ! git rev-parse -q --verify FETCH_HEAD >/dev/null 2>&1; then
            fetch "$GH_REF" 2>/dev/null || fetch "$GH_SHA"
          fi
          git checkout -q FETCH_HEAD

      - name: 安装 pnpm（不用 marketplace action）
        # 容器里的 global 目录不可写（实测 npm i -g 报权限错），装到工作区内前缀再加 PATH
        run: |
          set -eu
          npm i -g pnpm@10 --prefix "$PWD/.toolchain" --silent
          echo "$PWD/.toolchain/bin" >> "$GITHUB_PATH"
          "$PWD/.toolchain/bin/pnpm" --version

      - run: pnpm install --frozen-lockfile

      - name: 重新构建
        run: npm run build

      - name: lib/ 是否与提交一致
        run: |
          if ! git diff --quiet -- lib/; then
            echo "::error title=lib/ 落后于 src::干净检出后重建，lib/ 与提交产物不一致。改 src/ 必须同 PR 重建 lib/。"
            git diff --stat -- lib/
            exit 1
          fi
          echo "✔ lib/ 与 src/ 逐字节一致"

      - name: 产物里不得含构建机绝对路径
        # 背景：已发布的 dsh-group-status@0.2.2 里 lib/client.js 有 5 处 /home/<user>/…
        # （dsh-later@1.4.0 与 dsh-suggest-ghost@0.5.1 均为 0 处）。根因在
        # build/tools/tsdown.client.ts 的 CSS 虚拟模块 id，已由 fix/build-css-identity 修掉，
        # 所以这条可以 blocking —— 回归即挡。
        run: |
          # 注意 pipefail：act/Gitea 的 shell 是 `bash -e -o pipefail`，而 GitHub 是 `bash -e`。
          # grep 无匹配时返回 1，在 pipefail 下会让整条管道失败并触发 -e 中止 —— 曾把"0 处泄漏"
          # 误判成失败。所以这里显式吞掉 grep 的退出码。
          n=$( (grep -rnoE "/home/[A-Za-z0-9_.-]+/" lib/ 2>/dev/null || true) | wc -l )
          if [ "$n" -gt 0 ]; then
            echo "::error title=产物泄漏构建机路径::lib/ 里有 $n 处 /home/... 会被发进 npm 包。"
            grep -rlE "/home/[A-Za-z0-9_.-]+/" lib/ | sed 's/^/    /'
            exit 1
          fi
          echo "✔ 无绝对路径泄漏"

      - name: CSS module 前缀必须可复现
        # 类名前缀是 lightningcss 对**仓库相对**样式表路径取哈希得来的；若哪天又退回绝对路径，
        # 同一 commit 在不同目录会产出不同前缀。把整棵树搬到另一个路径再构建一次即可验证，
        # 复用已装好的依赖（pnpm 的 node_modules 是指向 store 的符号链接，cp -a 保留后仍可解析）。
        run: |
          set -e
          copy=$(mktemp -d)/moved/deep
          mkdir -p "$(dirname "$copy")"
          cp -a "$PWD/." "$copy"
          ( cd "$copy" && npm run build >/dev/null )
          # 排除 tsconfig.tsbuildinfo：它是被 .gitignore 掉的**增量缓存**，不是产物。里面的
          # `latestChangedDtsFile` 之类的字段取决于上一次构建动过哪些文件，同一份源码在"刚 clone
          # 完"和"本地反复构建过"两种状态下会给出不同值 —— 那是缓存状态差异，与产物可复现性无关，
          # 拿它判红只会让人去查一个不存在的绝对路径问题。真正要比的是编译输出。
          if diff -rq --exclude='*.tsbuildinfo' "$PWD/lib" "$copy/lib" >/dev/null; then
            echo "✔ 同一 commit 在两个不同目录构建，lib/ 逐字节一致"
          else
            echo "::error title=产物不可复现::换个目录构建就得到不同的 lib/ —— CSS 前缀大概又用上了绝对路径。"
            diff -rq --exclude='*.tsbuildinfo' "$PWD/lib" "$copy/lib" | head -5
            exit 1
          fi
