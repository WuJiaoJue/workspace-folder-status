# 由 release-infra 安装（2026-10-19）。只拦错，不碰发布。
# 严格程度是实测出来的，不是猜的：
#   - 本仓库 `npx tsc -p tsconfig.json --noEmit` 干净通过
#   - `npm test` 本地 174 例 1.4s 全过，且不在仓库留下改动
#   - 干净重建后 `lib/` 与提交产物**逐字节一致**（跨目录实测），所以漂移守卫无需任何排除。
# 这条在 fix/build-css-identity 之前是做不到排除的：tsdown 的 CSS module 前缀由构建机
# 绝对路径导出，lib/client.js 在任何别处重建都必然不同。构建器修好后排除项一并撤掉。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装依赖
        # 这里**不能**加 --ignore-scripts：tsdown 的原生二进制靠安装脚本落地
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: npx tsc -p tsconfig.json --noEmit
      - name: 测试
        run: npm test

  # 只读守卫：不装依赖、不跑构建，永远不会改写工作区
  release-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: repository.url 的 owner/repo 必须等于本仓库
        # 破了它，catalog 的 probe 判 false → 市场版本号/下载量消失
        run: |
          node -e "
            const p = require('./package.json');
            const url = p.repository?.url || '';
            const want = process.env.GITHUB_REPOSITORY.toLowerCase();
            if (!url) { console.error('::error::缺 repository.url'); process.exit(1); }
            if (!url.toLowerCase().includes(want)) {
              console.error('::error::repository.url=' + url + ' 不含 ' + want);
              process.exit(1);
            }
          "
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: prepare 钩子会破坏 --ignore-scripts 发布法
        run: |
          node -e "
            const p = require('./package.json');
            if (p.scripts?.prepare) {
              console.error('::error::有 prepare 钩子，请把构建移到 prepack / prepublishOnly');
              process.exit(1);
            }
          "
      - name: 入口产物已被 git 跟踪
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.main) process.exit(0);
            const { execSync } = require('node:child_process');
            if (!execSync('git ls-files ' + p.main).toString().trim()) {
              console.error('::error::' + p.main + ' 未被跟踪（约定：产物随源码提交）');
              process.exit(1);
            }
          "
      - name: CHANGELOG 有「未发布」节可写
        # 发版时要把它改名成版本节，否则 release notes 无源
        run: |
          grep -qE '^##[ \t]+\[?(未发布|Unreleased)\]?[ \t]*$' CHANGELOG.md || {
            echo "::error::CHANGELOG 没有「未发布」小节，发版时无处写 notes"
            exit 1
          }

  artifact-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: 重新构建
        run: npm run build
      - name: lib/ 是否与提交一致
        run: |
          if ! git diff --quiet -- lib/; then
            echo "::error title=lib/ 落后于 src::干净检出后重建，lib/ 与提交产物不一致。改 src/ 必须同 PR 重建 lib/。"
            git diff --stat -- lib/
            exit 1
          fi
          echo "✔ lib/ 与 src/ 逐字节一致"
      - name: 产物里不得含构建机绝对路径
        # 背景：已发布的 dsh-group-status@0.2.2 里 lib/client.js 有 5 处 /home/<user>/…
        # （dsh-later@1.4.0 与 dsh-suggest-ghost@0.5.1 均为 0 处）。根因在
        # build/tools/tsdown.client.ts 的 CSS 虚拟模块 id，已由 fix/build-css-identity 修掉，
        # 所以这条可以 blocking —— 回归即挡。
        run: |
          n=$(grep -rnoE "/home/[A-Za-z0-9_.-]+/" lib/ 2>/dev/null | wc -l)
          if [ "$n" -gt 0 ]; then
            echo "::error title=产物泄漏构建机路径::lib/ 里有 $n 处 /home/... 会被发进 npm 包。"
            grep -rlE "/home/[A-Za-z0-9_.-]+/" lib/ | sed 's/^/    /'
            exit 1
          fi
          echo "✔ 无绝对路径泄漏"
      - name: CSS module 前缀必须可复现
        # 类名前缀是 lightningcss 对**仓库相对**样式表路径取哈希得来的；若哪天又退回绝对路径，
        # 同一 commit 在不同目录会产出不同前缀。把整棵树搬到另一个路径再构建一次即可验证，
        # 复用已装好的依赖（pnpm 的 node_modules 是指向 store 的符号链接，cp -a 保留后仍可解析）。
        run: |
          set -e
          copy=$(mktemp -d)/moved/deep
          mkdir -p "$(dirname "$copy")"
          cp -a "$GITHUB_WORKSPACE" "$copy"
          ( cd "$copy" && npm run build >/dev/null )
          if diff -rq "$GITHUB_WORKSPACE/lib" "$copy/lib" >/dev/null; then
            echo "✔ 同一 commit 在两个不同目录构建，lib/ 逐字节一致"
          else
            echo "::error title=产物不可复现::换个目录构建就得到不同的 lib/ —— CSS 前缀大概又用上了绝对路径。"
            diff -rq "$GITHUB_WORKSPACE/lib" "$copy/lib" | head -5
            exit 1
          fi
